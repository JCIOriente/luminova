<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0A1733" />

    <!-- Warm the Firestore origin: every page's first data read (site-config, showcase)
         hits it cold via the lite REST transport. crossorigin — it's a CORS fetch. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <!-- Warm the Firebase Storage origin that serves showcase / ally images (below-fold, no CORS). -->
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" />
    <link rel="canonical" href="https://jcioriente.web.app/" />
    <meta
      name="description"
      content="JCI Oriente — Capítulo Santa Cruz de la Cámara Junior Internacional. Desarrollando líderes con impacto desde 1993."
    />
    <title>JCI Oriente — Cámara Junior Internacional, Santa Cruz</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JCI Oriente" />
    <meta property="og:locale" content="es_BO" />
    <meta property="og:title" content="JCI Oriente — Cámara Junior Internacional, Santa Cruz" />
    <meta
      property="og:description"
      content="Desarrollando líderes con impacto en el Oriente boliviano desde 1993. Conoce nuestros programas, impacto y cómo unirte."
    />
    <meta property="og:url" content="https://jcioriente.web.app/" />
    <meta property="og:image" content="https://jcioriente.web.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="JCI Oriente — Se ve, se siente, el espíritu de Oriente."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JCI Oriente — Cámara Junior Internacional, Santa Cruz" />
    <meta
      name="twitter:description"
      content="Desarrollando líderes con impacto en el Oriente boliviano desde 1993."
    />
    <meta name="twitter:image" content="https://jcioriente.web.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
