name: firebase-setup
description: >-
  Shared deploy-job setup: Node + pnpm, pinned firebase-tools (cached), keyless Workload
  Identity Federation sign-in, pinned gcloud, then the brand. Assumes the repo is checked
  out. Where CD deploys and as whom come from the repository variables, which deploy.yml's
  workflow-level `env:` passes to every step, these included (FIREBASE_PROJECT_ID,
  GCP_PROJECT_NUMBER, and the optional GCP_REGION, WIF_PROVIDER, DEPLOY_SA); the brand
  comes from the project's bucket (docs/specs/2026-10-29-brand-outside-repo.md, "CD from a
  fork").
outputs:
  project_id:
    description: The Firebase project id (also exported as GCP_PROJECT_ID)
    value: ${{ steps.config.outputs.project_id }}
  spotlight_url:
    description: The public site's production origin
    value: ${{ steps.config.outputs.spotlight_url }}
  spotlight_site:
    description: The public site's Firebase Hosting site id
    value: ${{ steps.config.outputs.spotlight_site }}
  backstage_site:
    description: The admin site's Firebase Hosting site id
    value: ${{ steps.config.outputs.backstage_site }}
runs:
  using: composite
  steps:
    # The variables first: a missing or malformed one stops the job here, before anything
    # is installed or any credential minted. deploy-ready.sh checks every value against an
    # anchored pattern (so none carries a line break into $GITHUB_OUTPUT or $GITHUB_ENV)
    # and derives the provider and service account brand:provision creates.
    - name: Read the deploy target from the repository variables
      id: target
      shell: bash
      run: |
        set -euo pipefail
        bash .github/scripts/deploy-ready.sh > "$RUNNER_TEMP/deploy-target"
        if ! grep -qx 'ready=true' "$RUNNER_TEMP/deploy-target"; then
          sed -n 's/^reason=/::error title=Not set up to deploy::/p' "$RUNNER_TEMP/deploy-target"
          exit 1
        fi
        cat "$RUNNER_TEMP/deploy-target" >> "$GITHUB_OUTPUT"
        # Later steps of the job deploy with --project "$GCP_PROJECT_ID"; the functions
        # job's assert reads GCP_REGION.
        sed -n -e 's/^project=/GCP_PROJECT_ID=/p' -e 's/^region=/GCP_REGION=/p' \
          "$RUNNER_TEMP/deploy-target" >> "$GITHUB_ENV"
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    # Before the sign-in, so no dependency's install script runs while a credential exists.
    # CI is set on the runner, so install does not seed brand/local/ from the example.
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Pinned global firebase-tools under a user-owned prefix (no sudo), cached across
    # runs; only re-downloads when the version key changes. Matches the CI workflow.
    - run: |
        npm config set prefix "$HOME/.npm-global"
        echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      shell: bash
    - id: fbcache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.npm-global
        key: firebase-tools-${{ runner.os }}-15.22.1
    - if: steps.fbcache.outputs.cache-hit != 'true'
      run: npm install -g firebase-tools@15.22.1
      shell: bash
    # Keyless: exchanges the GitHub OIDC token for short-lived GCP credentials (ADC).
    # firebase-tools and gcloud pick these up — no firebase login, no stored key. GCP's STS
    # honors the token only for the repository and ref the provider's attribute condition
    # names (the fork itself, refs/heads/main).
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ steps.target.outputs.workload_identity_provider }}
        service_account: ${{ steps.target.outputs.service_account }}
    # brand:pull and the functions job's assert run `gcloud`. ubuntu-24.04 ships the Cloud
    # SDK today, but a guard must not depend on something we neither pin nor control
    # (guardrail #6), so it is pinned here.
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
    # The brand is not in git: brand.toml and the images come from <project>-brand-assets
    # (read-only to the deploy account) into brand/local/, which brand/ then selects. A
    # bucket without a brand.toml, one naming another project, or an invalid image fails
    # here, before any build; live hosting is untouched. BRAND_CD_PROJECT (the validated
    # project, never a variable a member's shell may carry) is what puts brand:pull and
    # brand:ci-config in CD mode.
    - name: Pull the brand from the project's bucket
      shell: bash
      env:
        BRAND_CD_PROJECT: ${{ steps.target.outputs.project }}
      run: pnpm -s brand:pull
    # Release rules on the pulled brand: it must be brand/local/, shippable, and name the
    # project CD signed in to. Each value is one output line; brand:ci-config refuses any
    # value with a line break, which could add an output of its own.
    - name: Read the hosting targets from the pulled brand
      id: config
      shell: bash
      env:
        BRAND_RELEASE: "1"
        BRAND_CD_PROJECT: ${{ steps.target.outputs.project }}
      run: |
        set -euo pipefail
        pnpm -s brand:ci-config > "$RUNNER_TEMP/brand-ci-config"
        cat "$RUNNER_TEMP/brand-ci-config" >> "$GITHUB_OUTPUT"
    # .firebaserc (project, hosting sites, storage bucket) is generated from the brand.
    # BRAND_RELEASE=1 makes brand:apply refuse the example or a demo- profile.
    - name: Write .firebaserc from the pulled brand
      shell: bash
      env:
        BRAND_RELEASE: "1"
      run: pnpm -s brand:apply
