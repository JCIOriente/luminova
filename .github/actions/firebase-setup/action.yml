name: firebase-setup
description: >-
  Shared deploy-job setup — Node + pnpm, pinned firebase-tools (cached), and
  keyless Workload Identity Federation auth. Assumes the repo is already checked out.
inputs:
  workload_identity_provider:
    description: Full WIF provider resource name
    required: true
  service_account:
    description: Deploy service account email
    required: true
  brand_profile:
    description: >-
      The brand profile this project ships (the production variable BRAND_PROFILE). Used
      only to write .firebaserc; the hosting build reads the variable itself.
    required: true
runs:
  using: composite
  steps:
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
      env:
        BRAND_PROFILE: ${{ inputs.brand_profile }}
    # .firebaserc (project, hosting sites, storage bucket) is generated from the profile.
    # `prepare` writes it on install, but pnpm skips `prepare` on an up-to-date install,
    # so it is written explicitly: no deploy depends on that lifecycle detail.
    - name: Write .firebaserc from the brand profile
      shell: bash
      env:
        BRAND_PROFILE: ${{ inputs.brand_profile }}
      run: |
        set -euo pipefail
        if [ -z "${BRAND_PROFILE:-}" ]; then
          echo "::error::The production variable BRAND_PROFILE is unset (gh variable set BRAND_PROFILE --env production --body <slug>)."
          exit 1
        fi
        pnpm -s brand:apply
    # Pinned global firebase-tools under a user-owned prefix (no sudo), cached across
    # runs; only re-downloads when the version key changes. Matches the CI workflow.
    - run: |
        npm config set prefix "$HOME/.npm-global"
        echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      shell: bash
    - id: fbcache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.npm-global
        key: firebase-tools-${{ runner.os }}-15.22.1
    - if: steps.fbcache.outputs.cache-hit != 'true'
      run: npm install -g firebase-tools@15.22.1
      shell: bash
    # Keyless: exchanges the GitHub OIDC token for short-lived GCP credentials (ADC).
    # firebase-tools picks these up automatically — no firebase login, no stored key.
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
