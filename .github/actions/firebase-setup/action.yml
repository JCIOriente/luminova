name: firebase-setup
description: >-
  Shared deploy-job setup — Node + pnpm, pinned firebase-tools (cached), and
  keyless Workload Identity Federation auth. Assumes the repo is already checked out.
  Everything it needs comes from the repo: brand/ selects the brand profile (its one chapter
  profile, else the example), whose brand.json names the project and CD's sign-in (specs
  docs/specs/2026-10-25-repo-contained-config.md, docs/specs/2026-10-25-profile-discovery.md).
outputs:
  profile:
    description: The brand profile brand/ selects
    value: ${{ steps.config.outputs.profile }}
  project_id:
    description: The profile's Firebase project id (also exported as GCP_PROJECT_ID)
    value: ${{ steps.config.outputs.project_id }}
runs:
  using: composite
  steps:
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    # Release rules first: an unshippable profile or a missing deploy section stops the
    # job here, before any credential is minted. The values pass the brand.json schema
    # (a Workload Identity resource name, an email, a project id), so none holds a newline.
    - name: Read the deploy target from the repo
      id: config
      shell: bash
      env:
        BRAND_RELEASE: "1"
      run: |
        set -euo pipefail
        pnpm -s brand:ci-config > "$RUNNER_TEMP/brand-ci-config"
        cat "$RUNNER_TEMP/brand-ci-config" >> "$GITHUB_OUTPUT"
        # Later steps of the job deploy with --project "$GCP_PROJECT_ID".
        sed -n 's/^project_id=/GCP_PROJECT_ID=/p' "$RUNNER_TEMP/brand-ci-config" >> "$GITHUB_ENV"
    # .firebaserc (project, hosting sites, storage bucket) is generated from the profile.
    # `prepare` writes it on install, but pnpm skips `prepare` on an up-to-date install,
    # so it is written explicitly: no deploy depends on that lifecycle detail.
    # BRAND_RELEASE=1 makes brand:apply refuse a fixture or demo- profile.
    - name: Write .firebaserc from the brand profile
      shell: bash
      env:
        BRAND_RELEASE: "1"
      run: pnpm -s brand:apply
    # Pinned global firebase-tools under a user-owned prefix (no sudo), cached across
    # runs; only re-downloads when the version key changes. Matches the CI workflow.
    - run: |
        npm config set prefix "$HOME/.npm-global"
        echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      shell: bash
    - id: fbcache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.npm-global
        key: firebase-tools-${{ runner.os }}-15.22.1
    - if: steps.fbcache.outputs.cache-hit != 'true'
      run: npm install -g firebase-tools@15.22.1
      shell: bash
    # Keyless: exchanges the GitHub OIDC token for short-lived GCP credentials (ADC).
    # firebase-tools picks these up automatically — no firebase login, no stored key.
    - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
      with:
        workload_identity_provider: ${{ steps.config.outputs.workload_identity_provider }}
        service_account: ${{ steps.config.outputs.service_account }}
