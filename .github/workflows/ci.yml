name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Supersede in-progress runs only for PRs; never cancel a post-merge main run
  # (those validate what actually landed and shouldn't be lost to a rapid merge).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 so the change-filter can diff against the base/before SHA.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Skip the build/lint/test/audit suite when a PR touches ONLY inert files
      # (docs, markdown, license) — nothing to compile or test. The job still RUNS
      # and reports success on skip, so it stays safe to mark as a required status
      # check (a paths-skipped required check would deadlock the PR forever).
      # Conservative by design: images/assets are NOT inert (an imported .svg
      # affects the build) and any non-doc file -> run. Default is always run.
      - name: Detect code changes
        id: code
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "base SHA unavailable (new branch/force-push) -> running checks"
            exit 0
          fi
          remaining=$(git diff --name-only "$base...$head" \
            | grep -vE '(\.md$|^docs/|^LICENSE$|^\.gitignore$|^\.editorconfig$)' || true)
          if [ -n "$remaining" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "code files changed -> running checks"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "docs/inert files only -> skipping checks"
          fi
      - if: steps.code.outputs.run == 'true'
        run: corepack enable
      - if: steps.code.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.code.outputs.run == 'true'
        name: Install deps (guards un-allowlisted native builds)
        run: bash tools/scripts/pnpm-install-guarded.sh
      - if: steps.code.outputs.run == 'true'
        run: pnpm format
      - if: steps.code.outputs.run == 'true'
        run: pnpm turbo run lint typecheck build
      # The repo half of the App Check enforcement guard, and ONLY the repo half: the deployed
      # services are asserted after every release in deploy.yml, which is where a console edit
      # or a service-level env var can be seen at all. This catches the one thing a checkout
      # can hold — a committed dotenv that sets FUNCTIONS_EMULATOR, which would ship the two
      # unauthenticated invite callables with App Check disabled.
      #
      # IT RUNS AFTER THE BUILD, but be honest about what that buys, because the first version
      # of this comment was not. firebase-tools resolves the dotenv directory from the functions
      # SOURCE, not the repo path (`env.js` uses `opts.configDir || opts.functionsSource`, and
      # firebase.json declares `"source": "apps/beacon/dist"`), so `apps/beacon/dist/.env*` is
      # what would reach the deployed runtime.
      #
      # ON THIS RUNNER THAT ARM CANNOT FIRE. No turbo cache is configured in CI (only the pnpm
      # store and the firebase-tools/emulator binaries are cached), so `turbo run build` always
      # executes `apps/beacon/build.mjs`, whose first act is `rm(dist, {recursive, force})`. The
      # dist it scans is therefore always freshly built and cannot hold a stray dotenv. The arm
      # is live locally under `pnpm pr-tests`, where a turbo cache exists — belt and braces, not
      # a CI control. An earlier draft claimed a CI cache restore made it live; there is none.
      #
      # So what this step actually catches is a committed `apps/beacon/.env*` — a file
      # firebase-tools never reads for this project, which is why it is a hygiene signal and not
      # a production control. The control is the post-deploy assertion in deploy.yml. What keeps
      # the committed-file vector unreachable at all is pinned by the invariant test below.
      #
      # The `(export)?` mirrors firebase-tools' own LINE_RE (`^\s*(?:export)?\s*([\w./]+)\s*=`),
      # which accepts the shell `export FOO=bar` spelling as an ordinary assignment. Without it
      # this grep missed a line the parser honours. `[[:space:]]*` rather than `+` for the same
      # reason: the parser's `\s*` is optional there too, so even `exportFUNCTIONS_EMULATOR=true`
      # reads as that key. `-s` suppresses grep's complaint when the `.env*` glob matches
      # nothing, which is the normal case.
      - if: steps.code.outputs.run == 'true'
        name: Guard — no FUNCTIONS_EMULATOR override in a beacon env file
        run: bash .github/scripts/assert-no-dotenv-override.sh apps/beacon apps/beacon/dist
      # Initial-chunk gzip budgets (docs/performance.md §2). Runs after build so
      # apps/*/dist is present; fails the gate on a breach.
      - if: steps.code.outputs.run == 'true'
        run: bash tools/scripts/check-bundle-budget.sh
      # Unit suites only — exclude tests/* (those boot the Firestore emulator, see
      # the `emulator` job). beacon's own `test` task is unit-only; its emulator
      # suite is a separate `test:emulator` script.
      - if: steps.code.outputs.run == 'true'
        run: pnpm turbo run test --filter="./apps/*" --filter="./packages/*"
      - if: steps.code.outputs.run == 'true'
        run: pnpm knip
      # Non-blocking: a newly-published advisory against a transitive dep must not
      # turn every PR red with no code change. Audit stays visible in the logs;
      # CVE triage is handled out-of-band (secure-dep-vetting), not the merge gate.
      - if: steps.code.outputs.run == 'true'
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - if: steps.code.outputs.run == 'true'
        run: pnpm test:seed
      # The review rubric decides which reviews a PR owes; its fixture tests are
      # the only thing stopping a rubric edit from silently widening or dropping a
      # class. Gate them like any other guard (guardrail #6, claim == reality).
      - if: steps.code.outputs.run == 'true'
        run: pnpm test:harness
      # Same reasoning one layer out: the post-deploy App Check assertion runs once per
      # release against real services, so its fixtures are the only thing that exercises its
      # failure arms before they matter (guardrail #6, claim == reality).
      - if: steps.code.outputs.run == 'true'
        run: pnpm test:ci-scripts

  emulator:
    name: emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 so the change-filter can diff against the base/before SHA.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      # Only the engine/rules surfaces need the (slow, JVM) emulator suites. Most
      # PRs are spotlight/backstage UI and skip the heavy steps below — saving
      # Actions minutes. The job still RUNS and reports success, so it stays safe
      # to mark as a required status check (a paths-skipped required check would
      # otherwise deadlock the PR on "Expected — waiting").
      - name: Detect engine/rules changes
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "base SHA unavailable (new branch/force-push) -> running emulator suites"
            exit 0
          fi
          if git diff --name-only "$base...$head" \
            | grep -qE '^(apps/beacon/|tests/|tools/scripts/|\.github/workflows/ci\.yml|firestore\.rules|storage\.rules|firestore\.indexes\.json|firebase\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "engine/rules paths changed -> running emulator suites"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no engine/rules changes -> skipping emulator suites"
          fi
      - if: steps.filter.outputs.run == 'true'
        run: corepack enable
      - if: steps.filter.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.filter.outputs.run == 'true'
        name: Install deps (guards un-allowlisted native builds)
        run: bash tools/scripts/pnpm-install-guarded.sh
      # Firestore emulator runs on the JVM.
      - if: steps.filter.outputs.run == 'true'
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "21"
      # Pinned global Firebase CLI under a user-owned prefix (no sudo), cached
      # across runs so it only re-downloads when the version key changes.
      - if: steps.filter.outputs.run == 'true'
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
      - if: steps.filter.outputs.run == 'true'
        id: fbcache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm-global
          key: firebase-tools-${{ runner.os }}-15.22.1
      - if: steps.filter.outputs.run == 'true' && steps.fbcache.outputs.cache-hit != 'true'
        run: npm install -g firebase-tools@15.22.1
      - name: Cache Firestore emulator binary
        if: steps.filter.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}
      # Workspace package dists the emulator suites import (@luminova/types, etc.).
      - if: steps.filter.outputs.run == 'true'
        run: pnpm turbo run build --filter="./packages/*"
      # The beacon recompute race + write-skip guards (the reason this gate exists).
      - if: steps.filter.outputs.run == 'true'
        run: pnpm --filter beacon run test:emulator
      # Firestore + Storage security-rules suites. All emulator runs serialize
      # machine-wide via tools/scripts/with-emulator-lock.sh (shared port 4010).
      - if: steps.filter.outputs.run == 'true'
        run: pnpm --filter "./tests/*" run test
