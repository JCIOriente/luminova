name: Deploy

# Keyless CD. Runs only after the CI workflow concludes successfully on main.
# Auth = Workload Identity Federation (OIDC) — no long-lived credential is stored
# anywhere; GitHub mints a short-lived token per run, exchanged for a GCP token that
# GCP's STS only honors for this repo on refs/heads/main. Every deploy job is gated
# behind the `production` GitHub environment (required reviewer + main-only).
on:
  # `workflow_run` reads this file from the DEFAULT branch, so a feature/PR branch
  # can never alter deploy logic to exfiltrate the OIDC token — only code merged to
  # main changes how we deploy.
  workflow_run:
    workflows: ["CI"] # must equal `name:` in ci.yml
    types: [completed]
  # Manual escape hatch for first-run validation, re-deploys, and rollbacks.
  workflow_dispatch:
    inputs:
      surface:
        description: "all | rules | functions | hosting"
        default: "all"

# Least privilege at the top: only checkout rights by default. The OIDC minting
# right (`id-token: write`) is granted per-job to the three deploy jobs ONLY, so the
# ungated `filter`/`notify` jobs can never mint the deploy credential.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt an in-flight deploy

jobs:
  filter:
    name: filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # checkout
      actions: read # read the last successful Deploy run (change-since-last-deploy diff)
    # Deploy only on a green CI run that came from a push to main, or a manual run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'push')
    outputs:
      spotlight: ${{ steps.f.outputs.spotlight }}
      backstage: ${{ steps.f.outputs.backstage }}
      functions: ${{ steps.f.outputs.functions }}
      rules: ${{ steps.f.outputs.rules }}
      sha: ${{ steps.f.outputs.sha }}
    steps:
      # fetch-depth 0 so we can diff the deployed commit against any main ancestor.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # A fork that has not set up CD yet (local-only profile, or no "deploy" section)
      # skips every deploy job: no credential minted, no approval requested.
      - name: Is this repository set up to deploy?
        id: ready
        run: |
          set -euo pipefail
          bash .github/scripts/deploy-ready.sh | tee -a "$GITHUB_OUTPUT"
      - name: Explain a skipped deploy
        if: steps.ready.outputs.ready != 'true'
        env:
          REASON: ${{ steps.ready.outputs.reason }}
        run: |
          echo "::notice title=Deploy skipped::$REASON"
          { echo "### Deploy skipped"; echo; echo "$REASON"; } >> "$GITHUB_STEP_SUMMARY"
      - name: Detect changed surfaces
        id: f
        # Untrusted-ish inputs flow through env, never inline ${{ }} in the script,
        # so nothing can break out of the shell (defense in depth — dispatch is
        # already restricted to repo writers).
        env:
          EVENT_NAME: ${{ github.event_name }}
          SURFACE: ${{ github.event.inputs.surface }}
          EVENT_HEAD: ${{ github.event.workflow_run.head_sha }}
          FALLBACK_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          READY: ${{ steps.ready.outputs.ready }}
        run: |
          set -euo pipefail
          sp=false; bs=false; fn=false; rl=false
          head="${EVENT_HEAD:-$FALLBACK_SHA}"
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "not set up to deploy -> every surface off"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual run: deploy the requested surface(s), no diff.
            case "$SURFACE" in
              all)       sp=true; bs=true; fn=true; rl=true ;;
              hosting)   sp=true; bs=true ;;
              functions) fn=true ;;
              rules)     rl=true ;;
              *) echo "unknown surface '$SURFACE'"; exit 1 ;;
            esac
            echo "manual dispatch -> surface=$SURFACE"
          else
            # Diff against the last commit we SUCCESSFULLY deployed, not the first
            # parent. A prior run can be superseded (concurrency cancels the pending
            # run) or fail mid-deploy; first-parent diffing would then silently drop
            # that commit's surfaces forever. Diffing since the last successful Deploy
            # makes every run cover the cumulative change and self-heal a failed one.
            # Fallbacks: first parent, then deploy-all.
            base=$(gh run list --workflow Deploy --branch main --status success \
                     --limit 1 --json headSha -q '.[0].headSha // empty' 2>/dev/null || true)
            if [ -n "$base" ] && [ "$base" != "$head" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "diffing against last successful deploy: $base"
            elif git cat-file -e "${head}^^{commit}" 2>/dev/null; then
              base="${head}^"
              echo "no usable prior deploy -> diffing against first parent: $base"
            else
              base=""
              sp=true; bs=true; fn=true; rl=true
              echo "no base commit available -> deploying all surfaces (fail-safe)"
            fi
            # The last deploy ran before this repo was set up (it skipped), so this
            # is the first real deploy: every surface, whatever the diff says.
            # A base the script cannot read (before luminova.json existed) counts as not set
            # up; its message stays in the log.
            if [ -n "$base" ] && ! bash .github/scripts/deploy-ready.sh . "$base" | grep -qx 'ready=true'; then
              sp=true; bs=true; fn=true; rl=true
              echo "base $base was not set up to deploy -> first deploy: all surfaces"
              base=""
            fi
            if [ -n "$base" ]; then
              diff=$(git diff --name-only "$base...$head")
              echo "changed files:"; echo "$diff"
              q() { printf '%s\n' "$diff" | grep -qE "$1"; }
              # Root dep/build files feed every app+functions bundle — a CVE override
              # in pnpm-lock/pnpm-workspace (or a root package.json/turbo.json change)
              # must redeploy the bundles that embed it, or prod keeps serving the old
              # vulnerable build. packages/** does too; firebase.json touches all;
              # brand/** (profiles) feeds both frontends. luminova.json picks the profile,
              # so the project itself: a change redeploys every surface, rules included.
              # A bucket asset change is not in git, so it needs a manual
              # `surface=hosting` dispatch.
              root='^pnpm-lock\.yaml$|^pnpm-workspace\.yaml$|^package\.json$|^turbo\.json$|^luminova\.json$'
              q "^apps/spotlight/|^packages/|^brand/|^firebase\.json$|$root" && sp=true || true
              q "^apps/backstage/|^packages/|^brand/|^firebase\.json$|$root" && bs=true || true
              q "^apps/beacon/|^packages/|^firebase\.json$|$root"    && fn=true || true
              q '^firestore\.rules$|^storage\.rules$|^firestore\.indexes\.json$|^firebase\.json$|^luminova\.json$' && rl=true || true
            fi
          fi
          {
            echo "spotlight=$sp"
            echo "backstage=$bs"
            echo "functions=$fn"
            echo "rules=$rl"
          } >> "$GITHUB_OUTPUT"
          echo "resolved -> spotlight=$sp backstage=$bs functions=$fn rules=$rl"

  # Order: rules -> functions -> hosting. Data contract lands before the backend that
  # relies on it; backend lands before the UI that calls it; user-visible hosting flips
  # last and only after a smoke test passes.
  deploy-rules:
    name: deploy-rules
    needs: filter
    if: needs.filter.outputs.rules == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      id-token: write # mint the OIDC token for WIF
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.filter.outputs.sha }}
      # Sets GCP_PROJECT_ID from the profile luminova.json selects.
      - uses: ./.github/actions/firebase-setup
      - name: Deploy rules + storage
        env:
          SHA: ${{ needs.filter.outputs.sha }}
        run: |
          set -euo pipefail
          firebase deploy \
            --only firestore:rules,storage \
            --project "$GCP_PROJECT_ID" --non-interactive --force \
            --message "$SHA"
      # Indexes deploy WITHOUT --force on purpose: additive index creation proceeds,
      # but a would-be index DELETION (an index in prod not mirrored in
      # firestore.indexes.json) aborts the deploy under --non-interactive instead of
      # being silently reaped. firestore.indexes.json is the single source of truth;
      # reconcile any console-created index into it before it can be deleted here.
      - name: Deploy indexes (delete-safe, no --force)
        env:
          SHA: ${{ needs.filter.outputs.sha }}
        run: |
          set -euo pipefail
          firebase deploy \
            --only firestore:indexes \
            --project "$GCP_PROJECT_ID" --non-interactive \
            --message "$SHA"

  deploy-functions:
    name: deploy-functions
    needs: [filter, deploy-rules]
    # Runs when functions changed and the rules stage did not FAIL (skipped is fine).
    if: >-
      always() &&
      needs.deploy-rules.result != 'failure' &&
      needs.deploy-rules.result != 'cancelled' &&
      needs.filter.outputs.functions == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.filter.outputs.sha }}
      - uses: ./.github/actions/firebase-setup
      # gcloud is NOT installed by firebase-setup. `google-github-actions/auth` writes ADC and
      # exports the credential override, but installs no CLI. ubuntu-24.04 does ship the Cloud
      # SDK today — the runner-images readme lists Google Cloud CLI 583.0.0 — so the assert
      # step below would run without this. Pinned anyway: the day that image detail changes,
      # the failure is every functions release failing AFTER the functions are already live.
      # A guard is not allowed to depend on something we neither pin nor control (guardrail #6).
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # firebase.json `predeploy` runs `pnpm turbo run build --filter beacon`.
      # --force skips the gen2 delete-confirmation prompt under --non-interactive.
      - name: Deploy functions (beacon)
        env:
          SHA: ${{ needs.filter.outputs.sha }}
        run: |
          set -euo pipefail
          firebase deploy --only functions \
            --project "$GCP_PROJECT_ID" --non-interactive --force \
            --message "$SHA"
      # EVERY deployed callable, and App Check is only half of it. FIREBASE_DEBUG_MODE +
      # skipTokenVerification make firebase-functions accept an UNSIGNED Auth ID token as well as
      # an unsigned App Check token, so a forged `roles: ["Admin"]` claim satisfies callable-auth.
      # On the five authenticated callables that is strictly worse than the invite pair: four
      # declare no enforceAppCheck at all, and on issueMemberInvite, which does, the same flag
      # forges the App Check token too. Our own guard refuses
      # in-process (token-verification-bypass.ts); this asserts the env of the services that are
      # now LIVE, which is the only control for FUNCTIONS_EMULATOR itself.
      #
      # BE HONEST ABOUT WHAT IT BUYS, because the step it replaces overstated itself twice and
      # a guard that gates nothing is worse than no guard. IT DETECTS, IT DOES NOT PREVENT:
      # the functions are already deployed and serving by the time this reads them. What it
      # does prevent is the rest of the release — `deploy-hosting` gates on
      # `needs.deploy-functions.result != 'failure'`, so a hit holds the UI back too. That is
      # deliberate: shipping a frontend against an endpoint whose attestation is off is worse
      # than shipping neither, and a red deploy is how an owner finds out at all.
      #
      # What it covers that the old pre-deploy grep structurally could not: a console edit, a
      # value set directly on the Cloud Run service, and a turbo cache hit restoring an
      # unlisted dotenv. (The old step scanned `apps/beacon`, which is not the directory
      # firebase-tools reads — `firebase.json` declares `"source": "apps/beacon/dist"` — and
      # its dist arm ran before `predeploy` built dist, so it never fired at all. The narrowed
      # repo grep now lives in ci.yml, after the build, where dist actually exists.)
      #
      # us-central1 is the gen2 default and is what these get: beacon sets no `region` on any
      # callable and calls no `setGlobalOptions`. The logic is in a script with a probe seam
      # so its arms are covered by fixtures — `node --test .github/scripts/*.test.mjs` — rather
      # than first executing against production.
      - name: Assert token verification is not bypassed on the DEPLOYED callables
        run: bash .github/scripts/assert-deployed-env-clean.sh describeinvite redeeminvite
          issuememberinvite recomputeallclaims reseedbuiltinroleperms seedroles setuserroles
      # Sanity: confirm the deploy registered functions (no auto-rollback for gen2 —
      # see the runbook; revert-and-redeploy is the documented path).
      - name: List deployed functions
        run: firebase functions:list --project "$GCP_PROJECT_ID" || true

  deploy-hosting:
    name: deploy-hosting
    # Needs BOTH prior stages: a failed rules deploy skips functions, and hosting must
    # not ship a UI whose data contract (rules) never landed. Check both results.
    needs: [filter, deploy-rules, deploy-functions]
    if: >-
      always() &&
      needs.deploy-rules.result != 'failure' &&
      needs.deploy-rules.result != 'cancelled' &&
      needs.deploy-functions.result != 'failure' &&
      needs.deploy-functions.result != 'cancelled' &&
      (needs.filter.outputs.spotlight == 'true' || needs.filter.outputs.backstage == 'true')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.brand.outputs.spotlight_url }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.filter.outputs.sha }}
      - uses: ./.github/actions/firebase-setup
        id: setup
      # brand:pull runs `gcloud storage`; same pin and reasoning as deploy-functions.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      # The brand assets live out of git, in the profile's private bucket (read-only to
      # this SA). An unreadable bucket or a missing file fails here, before any build;
      # live hosting is untouched. The summary records which generation of each file
      # shipped (they are not pinned in git, spec 5.7).
      - name: Pull brand assets
        id: brand
        env:
          BRAND_SLUG: ${{ steps.setup.outputs.profile }}
        run: |
          set -euo pipefail
          pnpm -s brand:pull
          profile="brand/${BRAND_SLUG}/brand.json"
          {
            echo "spotlight_url=$(jq -r '.urls.spotlight' "$profile")"
            echo "spotlight_site=$(jq -r '.firebase.sites.spotlight' "$profile")"
            echo "backstage_site=$(jq -r '.firebase.sites.backstage' "$profile")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Brand assets (profile \`${BRAND_SLUG}\`)"
            echo "| File | Generation |"
            echo "|---|---|"
            jq -r '.objects[] | "| \(.name) | \(.generation) |"' brand-assets/pull-manifest.json
          } >> "$GITHUB_STEP_SUMMARY"
      # Release builds of the changed target(s). BRAND_RELEASE=1 is the validation: the
      # build fails on any asset or config problem, on a profile/project mismatch with
      # GCP_PROJECT_ID (set by firebase-setup from the same luminova.json), and writes
      # dist/.brand-release.json. --force so turbo never
      # replays a cached dist. VITE_FIREBASE_EMULATOR_ENABLED=false guards against a dev
      # bundle ever reaching prod (a build without the flag is already off).
      # One turbo run, so the shared packages build once and the two apps in parallel.
      # The assert repeats the hosting predeploy so the gate holds even if a future
      # firebase-tools stops running hooks for channel deploys.
      - name: Release build
        env:
          SPOTLIGHT: ${{ needs.filter.outputs.spotlight }}
          BACKSTAGE: ${{ needs.filter.outputs.backstage }}
        run: |
          set -euo pipefail
          apps=()
          if [ "$SPOTLIGHT" = "true" ]; then apps+=(spotlight); fi
          if [ "$BACKSTAGE" = "true" ]; then apps+=(backstage); fi
          filters=()
          for app in "${apps[@]}"; do filters+=(--filter "$app"); done
          BRAND_RELEASE=1 VITE_FIREBASE_EMULATOR_ENABLED=false pnpm turbo run build "${filters[@]}" --force
          for app in "${apps[@]}"; do pnpm -s brand:assert-dist "$app"; done
      # Preview -> smoke -> promote. Each changed target deploys to a short-lived
      # preview channel; we smoke the channel URL (root HTML loads AND its hashed entry
      # bundle loads) and promote to `live` ONLY on success. Live never serves a build
      # that failed to load, so there is no rollback step; the preview auto-expires.
      - name: Deploy hosting (preview, smoke, promote)
        env:
          SPOTLIGHT: ${{ needs.filter.outputs.spotlight }}
          BACKSTAGE: ${{ needs.filter.outputs.backstage }}
          SHA: ${{ needs.filter.outputs.sha }}
          SPOTLIGHT_SITE: ${{ steps.brand.outputs.spotlight_site }}
          BACKSTAGE_SITE: ${{ steps.brand.outputs.backstage_site }}
        run: |
          set -euo pipefail
          chan="ci-${SHA:0:7}"
          # NOTE: this function is invoked as `promote ... || rc=1`, which disables
          # errexit inside it — so EVERY failure path must be an explicit `return 1`.
          # Do not rely on `set -e` here.
          promote() {
            target="$1"; site="$2"
            echo "::group::preview deploy ($target -> channel $chan)"
            out=$(firebase hosting:channel:deploy "$chan" --only "$target" \
                  --expires 1d --json --project "$GCP_PROJECT_ID") \
              || { echo "::endgroup::"; echo "ERROR: preview deploy failed for $site"; return 1; }
            printf '%s\n' "$out"
            echo "::endgroup::"
            url=$(printf '%s' "$out" | jq -r 'first(.result[].url)')
            if [ -z "$url" ] || [ "$url" = "null" ]; then
              echo "ERROR: no preview URL returned for $site"; return 1
            fi
            echo "smoke test: $url"
            html=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url") \
              || { echo "ERROR: smoke FAILED (root did not load) for $site"; return 1; }
            # Verify the hashed entry bundle referenced by the shell actually loads —
            # a plain 200 on the SPA shell would otherwise mask a broken/missing build.
            asset=$(printf '%s' "$html" | grep -oE '/assets/[A-Za-z0-9._-]+\.js' | head -1 || true)
            if [ -n "$asset" ]; then
              echo "asset check: ${url%/}${asset}"
              curl -fsS --retry 3 --retry-delay 3 --retry-all-errors -o /dev/null "${url%/}${asset}" \
                || { echo "ERROR: entry bundle $asset failed to load for $site"; return 1; }
            else
              echo "WARNING: no /assets/*.js reference found in $site shell — skipping asset check"
            fi
            echo "smoke passed -> promoting $site:$chan to $site:live"
            firebase hosting:clone "$site:$chan" "$site:live" --project "$GCP_PROJECT_ID" \
              || { echo "ERROR: promote (hosting:clone) failed for $site"; return 1; }
          }
          rc=0
          # Targets are chapter-neutral (firebase.json); site ids come from the profile.
          if [ "$SPOTLIGHT" = "true" ]; then promote spotlight "$SPOTLIGHT_SITE" || rc=1; fi
          if [ "$BACKSTAGE" = "true" ]; then promote backstage "$BACKSTAGE_SITE" || rc=1; fi
          if [ "$rc" != "0" ]; then
            echo "one or more targets failed -> those targets' live was left untouched"
          fi
          exit $rc

  # Best-effort outcome notification. No-op unless DEPLOY_WEBHOOK_URL is configured
  # (Slack- or Discord-compatible incoming webhook). Never fails the deploy.
  notify:
    name: notify
    needs: [filter, deploy-rules, deploy-functions, deploy-hosting]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post deploy result
        env:
          WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          R_RULES: ${{ needs.deploy-rules.result }}
          R_FUNCS: ${{ needs.deploy-functions.result }}
          R_HOST: ${{ needs.deploy-hosting.result }}
          SHA: ${{ needs.filter.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then echo "DEPLOY_WEBHOOK_URL unset -> skip"; exit 0; fi
          ran=false
          for r in "$R_RULES" "$R_FUNCS" "$R_HOST"; do
            case "$r" in success|failure) ran=true ;; esac
          done
          if [ "$ran" != "true" ]; then echo "nothing deployed -> skip notify"; exit 0; fi
          status="✅ success"
          case "$R_RULES$R_FUNCS$R_HOST" in *failure*) status="❌ failure" ;; esac
          text="Deploy ${status} — ${SHA:0:7} (rules=${R_RULES} functions=${R_FUNCS} hosting=${R_HOST}) ${RUN_URL}"
          # Slack reads `text`; Discord reads `content`. Sending both keeps it portable.
          payload=$(jq -nc --arg t "$text" '{text:$t, content:$t}')
          # A webhook outage must not turn the deploy run red — notification is best-effort.
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK" \
            || echo "webhook post failed (non-fatal)"
