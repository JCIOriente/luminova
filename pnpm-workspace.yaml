packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
overrides:
  # Dedupe to ONE dismissable-layer instance. react-dialog@1.1.15 pins 1.1.11 and
  # react-popover@1.1.16 pins 1.1.12; two copies = two React contexts, so a Popover
  # (Combobox/MultiSelect) portaled inside a modal Sheet (Dialog) renders but is
  # UNCLICKABLE (the modal pointer-events lock never exempts it). One version fixes it.
  "@radix-ui/react-dismissable-layer": "1.1.12"
allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@radix-ui/primitive@1.1.4"
  - "@radix-ui/react-arrow@1.1.9"
  - "@radix-ui/react-compose-refs@1.1.3"
  - "@radix-ui/react-context@1.1.4"
  - "@radix-ui/react-dismissable-layer@1.1.12"
  - "@radix-ui/react-focus-guards@1.1.4"
  - "@radix-ui/react-focus-scope@1.1.9"
  - "@radix-ui/react-id@1.1.2"
  - "@radix-ui/react-popover@1.1.16"
  - "@radix-ui/react-popper@1.3.0"
  - "@radix-ui/react-portal@1.1.11"
  - "@radix-ui/react-presence@1.1.6"
  - "@radix-ui/react-primitive@2.1.5"
  - "@radix-ui/react-slot@1.2.5"
  - "@radix-ui/react-use-callback-ref@1.1.2"
  - "@radix-ui/react-use-controllable-state@1.2.3"
  - "@radix-ui/react-use-effect-event@0.0.3"
  - "@radix-ui/react-use-escape-keydown@1.1.2"
  - "@radix-ui/react-use-layout-effect@1.1.2"
  - "@radix-ui/react-use-rect@1.1.2"
  - "@radix-ui/react-use-size@1.1.2"
  - "@radix-ui/rect@1.1.2"
