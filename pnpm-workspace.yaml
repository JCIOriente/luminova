packages:
  - "apps/*"
  - "packages/*"
  - "tests/*"
overrides:
  # Dedupe the Radix internals that hold cross-component React contexts to ONE
  # version each. react-dialog (the Sheet) and react-popover (Combobox/MultiSelect)
  # pin DIFFERENT patch versions, so two copies = two contexts, and a Popover
  # portaled inside a modal Sheet breaks: dismissable-layer → dropdown rendered but
  # UNCLICKABLE (modal pointer-events lock never exempts it); focus-scope → the
  # modal's focus trap yanks focus from the cmdk search input (can't type to filter).
  # One version each restores Radix's nested-layer/focus coordination.
  "@radix-ui/react-dismissable-layer": "1.1.12"
  "@radix-ui/react-focus-scope": "1.1.9"
  # Patch browserslist GHSA-c83g-rgw3-j3cx (unbounded memory growth / cache
  # eviction OOM) and GHSA-73wf-gq98-2v4g (uncaught crash / prototype write via
  # browserslist-stats.json), both <=4.28.6, patched >=4.28.7 — and the
  # baseline-browser-mapping DoS it pulls in, GHSA-w5vr-8v7q-w6rv (<2.11.0,
  # patched >=2.11.0). Deep transitive via @babel/core (eslint-plugin-react-hooks,
  # @tanstack/router-plugin); @babel/helper-compilation-targets@7.29.7 already
  # declares browserslist ^4.24.0, which admits the patch — but its lockfile
  # snapshot doesn't re-resolve on a plain `pnpm update browserslist`, so two
  # copies (one old, one new) coexist instead of converging. Forcing one version
  # resolves baseline-browser-mapping too (browserslist's own dependency, no
  # other consumer in the tree). Pinned exactly to 4.29.1, not caret — 4.29.2
  # published the same day this override was written, and pinning (rather than
  # `^4.29.1`, which would silently admit it) keeps a few days of real-world use
  # on the version actually installed. Dev tooling only, never shipped. Remove
  # once the lockfile naturally converges to one instance.
  "browserslist@<4.28.7": "4.29.1"
  # Patch HIGH advisory GHSA-gv7w-rqvm-qjhr (esbuild <0.28.1: RCE via NPM_CONFIG_REGISTRY).
  # Pre-existing repo-wide transitive (vite/vitest/@tailwindcss/vite); dev tooling only.
  "esbuild@<0.28.1": "^0.28.1"
  # Patch HIGH advisory GHSA-hmw2-7cc7-3qxx (form-data CRLF injection via unescaped
  # multipart field/filenames). It spans two lines pulled transitively: the 2.x copy
  # (@types/request>retry-request under firebase-admin/@google-cloud) and the 4.x copy
  # (wait-on>axios). Bump each within its own major to the security patch — 2.5.6 is
  # the official v2-backport; 4.0.6 is the patched 4.x — so consumers' ranges still hold.
  "form-data@<2.5.6": "^2.5.6"
  "form-data@>=4.0.0 <4.0.6": "^4.0.6"
  # Patch undici advisories (GHSA-vmh5-mc38-953g / -vxpw-j846-p89q / -hm92-r4w5-c3mj
  # / -35p6-xmwp-9g52 / -g8m3-5g58-fq7m / the <7.29.0 follow-up). Transitive via jsdom
  # (vitest/backstage/spotlight) — dev/test only, never shipped. Stay in major 7:
  # jsdom@29 require()s undici-7 internals (jsdom-dispatcher) that v8 removed, so
  # forcing v8 breaks the vitest jsdom env. 7.29.0 patches every advisory above and is
  # the latest 7.x — the floor moves, the major does not.
  "undici": "^7.29.0"
  # Patch uuid GHSA-w5hq-g745-h8pq (<11.1.1: missing buffer bounds check). Transitive
  # via firebase-admin>...>gaxios, which only uses v4() (random, no buf). Forced to the
  # latest major over the v8/v9 copies; v4 API is stable across these majors.
  "uuid": "^14.0.1"
  # Patch protobufjs GHSA-j3f2-48v5-ccww (>=8.0.0 <=8.6.5: DoS via infinite loop in
  # .proto option parsing). Transitive via firebase-admin>...>@grpc/proto-loader.
  # Forced to major 8; >=8.6.6 is patched (resolves to latest 8.x, currently 8.7.1).
  "protobufjs": "^8.6.6"
  # Patch websocket-driver <0.7.5 (GHSA-xv26-6w52-cph6 CRITICAL message corruption +
  # GHSA-mp7j-qc5w-4988 moderate resource-limit bypass). Transitive via
  # @firebase/database>faye-websocket (requires >=0.5.1, so 0.7.5 satisfies). 0.7.5 is
  # both latest and the patched release; freshly-published advisory fails audit repo-wide.
  "websocket-driver": "^0.7.5"
  # Patch axios GHSA-hcpx-6fm6-wx23 / -7q8q-rj6j-mhjq / -mwf2-3pr3-8698 (<1.18.0:
  # form-serializer maxDepth bypass + prototype-pollution + maxBodyLength bypass).
  # Transitive via wait-on (dev only). >=1.18.0 patches all; scoped to the vuln line.
  "axios@<1.18.0": ">=1.18.0"
  # Patch body-parser GHSA-v422-hmwv-36x6 (<1.20.6: DoS when an invalid limit value
  # silently disables size enforcement) AND, via body-parser's own bundled qs,
  # GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (qs array-limit bypass / isBuffer
  # DoS, both patched at qs >=6.16.0). Widened from <1.20.6 to <1.20.8: 1.20.6
  # cleared the first advisory but still bundles qs ~6.15.1 (below the qs floor);
  # 1.20.8 bundles qs ~6.16.0. RUNTIME dep of apps/beacon (Cloud Functions) via
  # firebase-functions>express@4 (express 4 requires body-parser ~1.20.x, so stay
  # in the 1.x line — 1.20.8 is inside express@4.22.3's own ~1.20.5 range below).
  "body-parser@<1.20.8": "^1.20.8"
  # Patch qs GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (see body-parser above) on
  # express's OWN direct qs edge (separate from the one bundled inside
  # body-parser). RUNTIME dep of apps/beacon via firebase-functions>express@4;
  # express@4.22.3 is the newest 4.x, already inside firebase-functions@7.2.5's
  # own express ^4.21.0, and its own qs range floors at ~6.16.0 — patched, no
  # major bump needed. A lockfile refresh alone didn't converge to this version
  # (confirmed: `pnpm --filter beacon update qs express body-parser` left it
  # stuck on the old pinned snapshot), hence the override. Remove once the
  # lockfile naturally resolves express >=4.22.3 unaided.
  "express@<4.22.3": "^4.22.3"
  # Patch brace-expansion ReDoS, now flagged on BOTH copies in the tree, each with its
  # own vulnerable range, so each needs its own selector inside its own major:
  #   v5 line (minimatch@10 requires ^5.0.5, via eslint>@eslint/config-array) — the
  #     advisory has been widened twice since the first override (<5.0.7, then <5.0.8,
  #     now <5.0.9); 5.0.9 is both the patch and the latest 5.x.
  #   v2 line (minimatch@5, via workbox-build>...>ejs>jake>filelist) — was untouched
  #     when the first override was written and is now in range (<2.1.4). minimatch@5
  #     requires ^2.0.1, so 2.1.4 stays inside its consumer's range.
  # Both are dev/build tooling only, never shipped.
  "brace-expansion@>=2.0.0 <2.1.4": "^2.1.4"
  "brace-expansion@>=3.0.0 <5.0.9": ">=5.0.9"
  # Patch fast-uri GHSA-5jgf-p345-68v8 / -f65p-4m7j-42xc / -fph4-wmhf-6fwf /
  # -jqff-g426-hqxp (widened again 2026-09-28: the floor this override targeted,
  # 3.1.5, is now itself flagged — every one of these four now reads <3.1.6).
  # Transitive via ajv (workbox-build, dev), which requires fast-uri ^3.0.1 — stay
  # in the 3.x line (latest 4.x would break that range). Targets 3.1.8, the latest
  # 3.x, not just the 3.1.6 floor. Remove once ajv's own floor clears 3.1.6+ on its
  # own (unlikely before a workbox-build major) or pnpm audit stops flagging it.
  "fast-uri@>=3.0.0 <3.1.6": "^3.1.8"
  # Patch nanoid GHSA-2v37-7h3g-55p8 and its predecessor (<3.3.18). Transitive via
  # postcss (vite/vitest/@tailwindcss/vite, dev). postcss requires nanoid ^3.3.x, so
  # the fix stays in the 3.x line; the selector's upper bound keeps any 5.x/6.x copy
  # out of scope.
  "nanoid@<3.3.18": "^3.3.18"
  # Patch postcss GHSA-r28c-9q8g-f849 (<=8.5.17: path traversal via sourceMappingURL
  # auto-loading, arbitrary .map disclosure). Transitive via vite (dev/build only —
  # the traversal needs an attacker-authored stylesheet, which this repo does not
  # process). 8.5.18 patches it; 8.5.26 is the latest 8.x.
  "postcss@<8.5.18": "^8.5.18"
  # Patch shell-quote GHSA (<=1.8.4). Transitive via concurrently (dev). >=1.8.5 patched.
  "shell-quote@<1.8.5": ">=1.8.5"
allowBuilds:
  "@firebase/util": true
  esbuild: true
  protobufjs: true
  # @vite-pwa/assets-generator (icon regen) pulls sharp, which ships a native
  # postinstall. Unlisted build scripts make `pnpm install --frozen-lockfile`
  # hard-fail with ERR_PNPM_IGNORED_BUILDS in CI. Prebuilt binaries, safe to run.
  sharp: true
